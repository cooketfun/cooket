name: cooket

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:15436:5432"
    volumes:
      - cooket_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - cooket_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - ./db:/cooket-db:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "/cooket-db/migrate.sh"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_LOCAL_DIR: /data/cooket-objects
      COOKET_CHAIN_ID: ${COOKET_CHAIN_ID:-5042002}
      COOKET_CORS_ORIGINS: ${COOKET_CORS_ORIGINS:-http://localhost:3200,http://127.0.0.1:3200}
      ARC_TESTNET_RPC_URL: ${ARC_TESTNET_RPC_URL:-https://rpc.testnet.arc.io}
    ports:
      - "127.0.0.1:4200:4000"
    volumes:
      - cooket_object_data:/data/cooket-objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    restart: unless-stopped
    environment:
      INDEXER_MODE: ${INDEXER_MODE:-idle}
      COOKET_CHAIN_ID: ${COOKET_CHAIN_ID:-5042002}
      ARC_TESTNET_RPC_URL: ${ARC_TESTNET_RPC_URL:-https://rpc.testnet.arc.io}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-}
      INDEXER_STOP_BLOCK: ${INDEXER_STOP_BLOCK:-}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-6}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-500}
      INDEXER_RPC_MAX_ATTEMPTS: ${INDEXER_RPC_MAX_ATTEMPTS:-3}
      INDEXER_RPC_INITIAL_DELAY_MS: ${INDEXER_RPC_INITIAL_DELAY_MS:-100}
      INDEXER_RPC_MAX_DELAY_MS: ${INDEXER_RPC_MAX_DELAY_MS:-2000}
      COOKET_INDEXER_CONTRACTS: ${COOKET_INDEXER_CONTRACTS:-}
      COOKET_FACTORY_V3_ADDRESS: ${COOKET_FACTORY_V3_ADDRESS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4200}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:?NEXT_PUBLIC_REOWN_PROJECT_ID must be set}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Cooket}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3200}
        # One Arc Testnet selector feeds API, indexer, and the frontend-safe build value.
        NEXT_PUBLIC_COOKET_CHAIN_ID: ${COOKET_CHAIN_ID:-5042002}
        NEXT_PUBLIC_ARC_TESTNET_RPC_URL: ${NEXT_PUBLIC_ARC_TESTNET_RPC_URL:-https://rpc.testnet.arc.io}
        NEXT_PUBLIC_COOKET_FACTORY_V3_ADDRESS: ${NEXT_PUBLIC_COOKET_FACTORY_V3_ADDRESS:-}
        NEXT_PUBLIC_FEE_MANAGER_V3_ADDRESS: ${NEXT_PUBLIC_FEE_MANAGER_V3_ADDRESS:-}
        NEXT_PUBLIC_GRADUATION_MANAGER_V3_ADDRESS: ${NEXT_PUBLIC_GRADUATION_MANAGER_V3_ADDRESS:-}
        NEXT_PUBLIC_PERMANENT_LP_FEE_VAULT_V3_ADDRESS: ${NEXT_PUBLIC_PERMANENT_LP_FEE_VAULT_V3_ADDRESS:-}
        NEXT_PUBLIC_PERMANENT_LP_CUSTODIAN_DEPLOYER_V3_ADDRESS: ${NEXT_PUBLIC_PERMANENT_LP_CUSTODIAN_DEPLOYER_V3_ADDRESS:-}
        NEXT_PUBLIC_GRADUATION_SETTLEMENT_EXECUTOR_V3_ADDRESS: ${NEXT_PUBLIC_GRADUATION_SETTLEMENT_EXECUTOR_V3_ADDRESS:-}
        NEXT_PUBLIC_ARC_TESTNET_UNISWAP_V3_SWAP_ROUTER: ${NEXT_PUBLIC_ARC_TESTNET_UNISWAP_V3_SWAP_ROUTER:-}
        NEXT_PUBLIC_ARC_TESTNET_UNISWAP_V3_QUOTER_V2: ${NEXT_PUBLIC_ARC_TESTNET_UNISWAP_V3_QUOTER_V2:-}
        NEXT_PUBLIC_ARC_TESTNET_UNISWAP_V3_FACTORY: ${NEXT_PUBLIC_ARC_TESTNET_UNISWAP_V3_FACTORY:-}
        NEXT_PUBLIC_ARC_TESTNET_CANONICAL_USDC: ${NEXT_PUBLIC_ARC_TESTNET_CANONICAL_USDC:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4200}
      NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:?NEXT_PUBLIC_REOWN_PROJECT_ID must be set}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Cooket}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3200}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000}
      NEXT_PUBLIC_COOKET_CHAIN_ID: ${COOKET_CHAIN_ID:-5042002}
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  cooket_postgres_data:
    name: cooket_postgres_data
  cooket_redis_data:
    name: cooket_redis_data
  cooket_object_data:
    name: cooket_object_data

networks:
  default:
    name: cooket_network
